<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6fa" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="style.css" />
    <title>听见 2.0 · 吉他与听觉练习室</title>
  </head>
  <body>
    <div id="shell">
      <aside id="rail"></aside>
      <div id="workspace">
        <header id="header"></header>
        <main id="main"></main>
      </div>
      <nav id="nav" aria-label="主导航"></nav>
    </div>
    <section id="modal" hidden aria-label="学习与练习详情"></section>
    <div id="toast" role="status" aria-live="polite"></div>
    <input
      type="file"
      id="backup-file"
      accept="application/json,.json"
      hidden
    />
    <script src="reference-data.js"></script>
    <script src="music-core.js"></script>
    <script src="audio-engine.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
    <script src="trainers.js"></script>
    <script src="labs.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
